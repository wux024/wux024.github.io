<link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">

<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="assets/css/academicons.min.css?v=20260907-1"/>
<link rel="stylesheet" href="assets/css/inter.css?v=20260907-1"/>

<script>
  (function () {
    var hour = new Date().getHours();
    var isNight = hour < 7 || hour >= 18;

    /* Theme: manual choice wins but only within its day/night period; otherwise auto */
    var m = null;
    try { m = localStorage.getItem('dark-mode'); } catch (e) {}
    var period = isNight ? 'night' : 'day';
    var manual = (m && m.indexOf(period + ':') === 0) ? m.slice(period.length + 1) : null;
    var dark;
    if (manual === '1') {
      dark = true;
    } else if (manual === '0') {
      dark = false;
    } else {
      dark = isNight || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    }
    if (dark) document.documentElement.classList.add('dark');

    var l = 'en';
    try { l = localStorage.getItem('lang') || 'en'; } catch (e) {}
    document.documentElement.classList.remove('lang-en', 'lang-zh');
    document.documentElement.classList.add(l === 'zh' ? 'lang-zh' : 'lang-en');

    /* Hero background: daily pool 7:00-18:00, fixed sunset otherwise (independent of theme) */
    var pool = [
      {%- for f in site.static_files -%}
      {%- if f.path contains "/images/bg/" -%}'{{ f.path | relative_url }}',{%- endif -%}
      {%- endfor -%}
    ];
    var hero = 'images/jmu-sunset.jpg';
    if (!isNight && pool.length) {
      hero = pool[Math.floor(Date.now() / 86400000) % pool.length];
      document.documentElement.style.setProperty('--daily-bg', "url('" + hero + "')");
    }
    var link = document.createElement('link');
    link.rel = 'preload';
    link.as = 'image';
    link.href = hero;
    document.head.appendChild(link);
  })();
</script>
