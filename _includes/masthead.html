<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button aria-label="Toggle navigation"><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="#top"><span lang="en">Homepage</span><span lang="zh">主页</span></a></li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}"><span lang="en">{{ link.title_en }}</span><span lang="zh">{{ link.title_zh }}</span></a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
    <button id="lang-toggle" aria-label="Switch language" title="Switch language">
      <span class="lang-indicator" aria-hidden="true"></span>
      <span class="lang-option lang-option-en">EN</span>
      <span class="lang-option lang-option-zh">中文</span>
    </button>
  </div>
</div>
